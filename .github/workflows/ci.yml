name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Check installer failure diagnostics
        run: |
          set +e
          output="$(LATEST_RELEASE_URL=file:///definitely-missing-agent-speak-release \
            sh ./install.sh --skip-audio-check 2>&1)"
          installer_exit_code=$?
          set -e
          printf '%s\n' "$output"
          test "$installer_exit_code" -ne 0
          grep -F "could not resolve the latest release for 4piu/agent-speak" <<<"$output"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install Linux audio dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Check installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) { throw ($errors -join [Environment]::NewLine) }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets

  macos:
    name: macOS 15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v6
      - name: Check installer syntax
        run: sh -n install.sh
      - name: Check normal installer failure diagnostics
        run: |
          set +e
          output="$(LATEST_RELEASE_URL=file:///definitely-missing-agent-speak-release \
            sh ./install.sh 2>&1)"
          installer_exit_code=$?
          set -e
          printf '%s\n' "$output"
          test "$installer_exit_code" -ne 0
          grep -F "could not resolve the latest release for 4piu/agent-speak" <<<"$output"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test debug build
        run: cargo test --locked --all-targets
      - name: Test release build
        run: cargo test --locked --release --all-targets
