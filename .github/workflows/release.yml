name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target "$TARGET"
          rustup default 1.89.0

      - name: Install Linux audio dependency
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Verify tag matches package version
        run: |
          package_id="$(cargo pkgid --locked -p agent-speak)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "release tag '$GITHUB_REF_NAME' must equal '$expected_tag'" >&2
            exit 1
          fi
          archive_name="agent-speak-$expected_tag-$TARGET"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Test release build
        run: cargo test --locked --release --all-targets --target "$TARGET"

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package tarball and checksum
        run: |
          package_root="$RUNNER_TEMP/$ARCHIVE_NAME"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_root" "$dist"

          cp "target/$TARGET/release/agent-speak" "$package_root/"
          cp README.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html \
            LICENSE install.sh install.ps1 "$package_root/"
          cp -R examples docs "$package_root/"

          archive="$dist/$ARCHIVE_NAME.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$ARCHIVE_NAME"
          checksum="$archive.sha256"
          hash="$(sha256sum "$archive" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "$(basename "$archive")" > "$checksum"

          extract_root="$RUNNER_TEMP/package-check"
          mkdir -p "$extract_root"
          tar -C "$extract_root" -xzf "$archive"
          "$extract_root/$ARCHIVE_NAME/agent-speak" --version
          "$extract_root/$ARCHIVE_NAME/agent-speak" serve --help >/dev/null

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        shell: pwsh
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target $env:TARGET
          rustup default 1.89.0

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1 | ConvertFrom-Json
          $package = $metadata.packages | Where-Object name -eq "agent-speak"
          if ($null -eq $package) {
            throw "agent-speak package was not found"
          }

          $expectedTag = "v$($package.version)"
          if ($env:GITHUB_REF_NAME -cne $expectedTag) {
            throw "release tag '$env:GITHUB_REF_NAME' must equal '$expectedTag'"
          }

          $archiveName = "agent-speak-$expectedTag-$env:TARGET"
          "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Test release build
        run: cargo test --locked --release --all-targets --target ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ env.TARGET }}

      - name: Package ZIP and checksum
        shell: pwsh
        run: |
          $packageRoot = Join-Path $env:RUNNER_TEMP $env:ARCHIVE_NAME
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $packageRoot, $dist | Out-Null

          Copy-Item "target/$env:TARGET/release/agent-speak.exe" $packageRoot
          Copy-Item "README.md", "THIRD_PARTY_NOTICES.md", "THIRD_PARTY_LICENSES.html", `
            "LICENSE", "install.sh", "install.ps1" $packageRoot
          Copy-Item "examples", "docs" $packageRoot -Recurse

          $archive = Join-Path $dist "$env:ARCHIVE_NAME.zip"
          Compress-Archive -Path $packageRoot -DestinationPath $archive -CompressionLevel Optimal

          $checksum = "$archive.sha256"
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$([System.IO.Path]::GetFileName($archive))" |
            Set-Content $checksum -Encoding ascii

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS 15 (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.0"
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust 1.89
        run: |
          rustup toolchain install 1.89.0 --profile minimal --target "$TARGET"
          rustup default 1.89.0

      - name: Verify tag matches package version
        run: |
          package_id="$(cargo pkgid --locked -p agent-speak)"
          package_version="${package_id##*#}"
          package_version="${package_version##*@}"
          expected_tag="v$package_version"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "release tag '$GITHUB_REF_NAME' must equal '$expected_tag'" >&2
            exit 1
          fi
          archive_name="agent-speak-$expected_tag-$TARGET"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"

      - name: Test release build
        run: cargo test --locked --release --all-targets --target "$TARGET"

      - name: Build release binary
        run: cargo build --locked --release --target "$TARGET"

      - name: Package tarball and checksum
        run: |
          package_root="$RUNNER_TEMP/$ARCHIVE_NAME"
          dist="$GITHUB_WORKSPACE/dist"
          mkdir -p "$package_root" "$dist"

          cp "target/$TARGET/release/agent-speak" "$package_root/"
          cp README.md THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html \
            LICENSE install.sh install.ps1 "$package_root/"
          cp -R examples docs "$package_root/"

          archive="$dist/$ARCHIVE_NAME.tar.gz"
          tar -C "$RUNNER_TEMP" -czf "$archive" "$ARCHIVE_NAME"
          checksum="$archive.sha256"
          hash="$(shasum -a 256 "$archive" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "$(basename "$archive")" > "$checksum"

          extract_root="$RUNNER_TEMP/package-check"
          mkdir -p "$extract_root"
          tar -C "$extract_root" -xzf "$archive"
          "$extract_root/$ARCHIVE_NAME/agent-speak" --version

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/*
          if-no-files-found: error

  source:
    name: Source and SBOM
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Package source and CycloneDX SBOM
        shell: bash
        run: |
          cargo fetch --locked
          cargo install cargo-about --version 0.9.1 --features cli --locked
          cargo about generate --locked --offline --fail --all-features \
            about.hbs --output-file "$RUNNER_TEMP/THIRD_PARTY_LICENSES.generated.html"
          tr -d '\r' < "$RUNNER_TEMP/THIRD_PARTY_LICENSES.generated.html" \
            > "$RUNNER_TEMP/THIRD_PARTY_LICENSES.normalized.html"
          cmp THIRD_PARTY_LICENSES.html "$RUNNER_TEMP/THIRD_PARTY_LICENSES.normalized.html"

          mkdir -p corresponding-source/mpl-crates
          while IFS=$'\t' read -r crate version; do
            crate_archive="$(find "$HOME/.cargo/registry/cache" -type f \
              -name "$crate-$version.crate" -print -quit)"
            test -n "$crate_archive" || {
              echo "MPL corresponding source package for $crate is missing" >&2
              exit 1
            }
            cp "$crate_archive" corresponding-source/mpl-crates/
          done < <(cargo metadata --locked --format-version 1 | jq -r \
            '.packages[] | select((.license // "") | contains("MPL-2.0")) | [.name,.version] | @tsv')

          archive_name="agent-speak-$GITHUB_REF_NAME-source"
          mkdir -p dist
          tar --exclude-vcs --exclude=target --exclude=dist \
            --transform "s,^,$archive_name/," \
            -czf "dist/$archive_name.tar.gz" .
          hash="$(sha256sum "dist/$archive_name.tar.gz" | awk '{print $1}')"
          printf '%s *%s\n' "$hash" "$archive_name.tar.gz" > "dist/$archive_name.tar.gz.sha256"

          cargo install cargo-cyclonedx --version 0.5.9 --locked
          sbom="agent-speak-$GITHUB_REF_NAME.sbom.cdx"
          cargo cyclonedx --format json --all --target all \
            --spec-version 1.5 --override-filename "$sbom"
          mv "$sbom.json" dist/

      - name: Preserve source artifacts
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, windows, macos, source]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release notes
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=()
          notes_file="docs/release-$GITHUB_REF_NAME.md"
          if [[ -f "$notes_file" ]]; then
            notes+=(--notes "$(cat "$notes_file")")
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            "${notes[@]}" \
            --title "Agent Speak $GITHUB_REF_NAME"
