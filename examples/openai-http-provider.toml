schema_version = 1
profile_name = "openai-http-notifications"

[permissions]
arbitrary_text = true
arbitrary_local_audio = false

[playback]
minimum_gain = 0.0
maximum_gain = 0.7
default_gain = 0.4
default_concurrency = "enqueue"
allowed_concurrency = ["enqueue", "interrupt"]
maximum_queue_items = 16
maximum_audio_seconds = 0

[outputs]
default_target = "system"

[[outputs.targets]]
id = "system"
description = "Current system default audio device"
kind = "system_default"
allow = ["audio", "speech"]

[tts]
enabled = true
backend = "utterpipe-openai-http"
model_id = "gpt-4o-mini-tts"
voice_id = "coral"
maximum_characters = 500

[tts.provider_options]
base_url = "https://api.openai.com/v1"
transport = "remote_https"
http_audio_format = "pcm"
api_key = "replace-with-service-api-key"
instructions = "Speak clearly and naturally."
voices = [{ id = "coral", name = "Coral", languages = ["en"] }]

[logging]
level = "warning"
history_enabled = false
history_include_spoken_text = false

[[audio_cues]]
id = "needs-attention"
kind = "speech"
text = "Your agent needs your attention."
description = "Use when work cannot continue without user input."
default_gain = 0.4

# Audio-file cues do not require permissions.arbitrary_local_audio. Provide the
# referenced file relative to this config, then uncomment this example.
