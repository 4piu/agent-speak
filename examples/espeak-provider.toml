schema_version = 1
profile_name = "espeak-notifications"

# Controls which arbitrary content MCP clients may play.
[permissions]
arbitrary_text = true
arbitrary_local_audio = false

# Sets gain, queueing, and decoded-audio safety limits.
[playback]
minimum_gain = 0.0
maximum_gain = 0.7
default_gain = 0.4
default_concurrency = "enqueue"
allowed_concurrency = ["enqueue", "interrupt"]
maximum_queue_items = 16
maximum_audio_seconds = 0

# Names the default output and the targets exposed to agents.
[outputs]
default_target = "system"

# Defines one agent-visible audio target.
[[outputs.targets]]
id = "system"
description = "Current system default audio device"
kind = "system_default"
allow = ["audio", "speech"]

# Selects the speech backend and host-side synthesis policy.
[tts]
enabled = true
backend = "utterpipe-espeak-ng"
maximum_characters = 300
provider_environment = []
agent_utterance_options = ["rate_wpm", "pitch"]

# Sets per-request provider defaults that authorized agent values may override.
[tts.utterance_options]
voice = "default"
rate_wpm = 175
pitch = 50
amplitude = 100

# Controls diagnostic output and optional local history.
[logging]
level = "warning"
history_enabled = false
history_include_spoken_text = false

# Defines one reusable agent-visible speech cue.
[[audio_cues]]
id = "needs-attention"
kind = "speech"
text = "Your agent needs your attention."
description = "Use when work cannot continue without user input."
default_gain = 0.4

# Provide this reusable audio file relative to the config, then uncomment it.
# [[audio_cues]]
# id = "finished-chime"
# kind = "audio_file"
# source = "sounds/finished.wav"
# description = "Use when a long-running task is complete."
# default_gain = 0.4

# Defines one reusable agent-visible speech cue.
[[audio_cues]]
id = "finished"
kind = "speech"
text = "The agent has finished its task."
description = "Use when a long-running task is complete."
default_gain = 0.4
